name: Bug report
description: Report an unexpected behavior in obs-unified.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more reproducible the report, the faster the fix.

  - type: input
    id: package
    attributes:
      label: Affected package(s)
      description: Which `@obsunified/*` package(s) are involved?
      placeholder: "@obsunified/telemetry-sdk@1.2.3"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What you expected to see instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps, code, or a repo link.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, runtime (Workers / Node / Bun / Deno), OS.
      placeholder: |
        - node: v22.10.0
        - runtime: Cloudflare Workers (wrangler 3.x)
        - os: macOS 15.1 arm64
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traces
      description: Paste any relevant output. Use code fences.
      render: shell
