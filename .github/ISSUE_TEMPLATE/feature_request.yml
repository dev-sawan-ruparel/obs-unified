name: Feature request
description: Suggest a new capability or improvement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not the proposed solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you ruled out and why.

  - type: dropdown
    id: scope
    attributes:
      label: Which area does this touch?
      multiple: true
      options:
        - Collector
        - Telemetry SDK (Node / Workers)
        - Analytics SDK (browser)
        - Dashboard UI
        - Polyglot SDKs (Go / Rust)
        - CLI
        - Docs
        - Other
    validations:
      required: true
