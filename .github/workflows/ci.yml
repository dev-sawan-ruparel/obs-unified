name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect changes
    runs-on: [self-hosted, obs-unified]
    outputs:
      go-sdk: ${{ steps.filter.outputs.go-sdk }}
      rust-sdk: ${{ steps.filter.outputs.rust-sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go-sdk:
              - 'sdks/go/**'
            rust-sdk:
              - 'sdks/rust/**'

  ts-check:
    name: TS — type-check + tests + build
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Unique per-runner dir avoids the ENOTEMPTY race when concurrent
          # self-hosted runner instances share the default ~/setup-pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PR TypeScript smoke
        if: github.event_name == 'pull_request'
        run: |
          pnpm -r --sort --filter @obs-unified/dashboard... --filter @obs-unified/collector... run build
          pnpm --filter @obs-unified/dashboard run type-check
          pnpm --filter @obs-unified/collector run type-check
      - name: Full TypeScript validation
        if: github.event_name != 'pull_request'
        run: |
          pnpm -r --sort run build
          pnpm -r run type-check
          pnpm -r run test

  lint:
    name: Lint
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Unique per-runner dir avoids the ENOTEMPTY race when concurrent
          # self-hosted runner instances share the default ~/setup-pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  messaging:
    name: Messaging parity
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Unique per-runner dir avoids the ENOTEMPTY race when concurrent
          # self-hosted runner instances share the default ~/setup-pnpm.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Manifest must be regenerated when a tool/field/scope changes in code…
      - run: pnpm run messaging:generate:check
      # …and lead-repo surfaces (READMEs, feature records) must match it.
      - run: pnpm run messaging:check
      # …and vendored copies in siblings must be in sync.
      - run: pnpm --filter @obs-unified/messaging run sync:check -- --require-all

  go-sdk:
    name: Go SDK
    runs-on: [self-hosted, obs-unified]
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go-sdk == 'true'
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: sdks/go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  rust-sdk:
    name: Rust SDK
    runs-on: [self-hosted, obs-unified]
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust-sdk == 'true'
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
