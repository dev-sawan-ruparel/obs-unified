name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ts-check:
    name: TS — type-check + tests + build
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run type-check
      - run: pnpm -r run test
      - run: pnpm -r run build

  lint:
    name: Lint
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  go-sdk:
    name: Go SDK
    runs-on: [self-hosted, obs-unified]
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdks/go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  rust-sdk:
    name: Rust SDK
    runs-on: [self-hosted, obs-unified]
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  docker-collector:
    name: Docker — collector-node image
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/collector-node/Dockerfile
          push: false
          tags: obs-unified/collector-node:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration — Postgres+MinIO+collector
    runs-on: [self-hosted, obs-unified]
    needs: [docker-collector]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: obs
          POSTGRES_PASSWORD: obs
          POSTGRES_DB: obs_unified
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obs -d obs_unified"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" run build
      - name: Run Postgres migrations
        env:
          DATABASE_URL: postgres://obs:obs@localhost:5432/obs_unified
        run: node apps/collector-node/scripts/migrate-pg.mjs
      - name: Smoke-test collector
        env:
          DATABASE_URL: postgres://obs:obs@localhost:5432/obs_unified
          # Smoke runs without S3 — wire-format tests don't need blob storage.
          S3_BUCKET: skip
          S3_ACCESS_KEY_ID: skip
          S3_SECRET_ACCESS_KEY: skip
          INGEST_KEY: dev-ingest-key
          DASHBOARD_PASSWORD: dev-pass
        run: |
          pnpm --filter @obs-demo/collector-node run start &
          SERVER_PID=$!
          # Wait up to 30s for /health
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8790/health
          kill $SERVER_PID || true

  conformance-interaction-id:
    name: Conformance — interaction_id
    runs-on: [self-hosted, obs-unified]
    needs: [ts-check, go-sdk, rust-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdks/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      # The conformance runner reads cases.json once and dispatches to
      # each SDK's native runner. Today each SDK runs its own vitest /
      # go test / cargo test against the same fixture file.
      - run: pnpm -r --filter "@obs-unified/*" run test
      - run: go test ./...
        working-directory: sdks/go
      - run: cargo test --all-features
        working-directory: sdks/rust
