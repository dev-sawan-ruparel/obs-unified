name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ts-check:
    name: TS — type-check + tests + build
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --sort run build
      - run: pnpm -r run type-check
      - run: pnpm -r run test

  lint:
    name: Lint
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  go-sdk:
    name: Go SDK
    runs-on: [self-hosted, obs-unified]
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: sdks/go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  rust-sdk:
    name: Rust SDK
    runs-on: [self-hosted, obs-unified]
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
