name: Publish all-in-one image

# Builds the all-in-one local image (Dockerfile.local) and pushes it to GHCR so
# first-time users can `docker run ghcr.io/obs-unified/local:latest` with no clone,
# no build, and no registry auth (public GHCR images are anonymously pullable).
#
# Triggers:
#   - workflow_dispatch: publish on demand (use this for the first publish)
#   - push to main: keep :latest aligned with the documented one-command path
#   - tag push (v*): publish a versioned image alongside :latest on release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-local-image:
    name: Build & push all-in-one image
    runs-on: [self-hosted, obs-unified]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Registers QEMU emulators so the arm64 self-hosted runner can also build
      # the linux/amd64 image. Harmless if binfmt is already present (colima).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.OBS_UNIFIED_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          tags="ghcr.io/obs-unified/local:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="$tags"$'\n'"ghcr.io/obs-unified/local:${{ github.ref_name }}"
          fi
          {
            echo 'value<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          push: true
          tags: ${{ steps.tags.outputs.value }}
          # Multi-arch so Apple-Silicon users don't pay an emulation penalty.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify public GHCR image
        env:
          GH_TOKEN: ${{ secrets.OBS_UNIFIED_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          if docker manifest inspect "ghcr.io/${OWNER}/local:latest" >/dev/null; then
            echo "ghcr.io/${OWNER}/local:latest is anonymously pullable"
            exit 0
          fi

          echo "::notice::GHCR image is not anonymously pullable yet; attempting to make package public"
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [ "$owner_type" = "Organization" ]; then
            endpoint="/orgs/${OWNER}/packages/container/local/visibility"
          else
            endpoint="/user/packages/container/local/visibility"
          fi
          gh api --method PATCH "$endpoint" -f visibility=public
          docker manifest inspect "ghcr.io/${OWNER}/local:latest" >/dev/null
