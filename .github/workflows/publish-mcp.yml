name: Publish MCP package

on:
  workflow_dispatch:
  push:
    tags:
      - "mcp-server-v*"
      - "v*"

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-mcp:
    name: Build & publish @obsunified/mcp-server to npmjs
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Unique per-runner dir avoids the ENOTEMPTY race when concurrent
          # self-hosted runner instances share the default ~/setup-pnpm.
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @obs-unified/types run build

      - run: pnpm --filter @obsunified/mcp-server run type-check

      - run: pnpm --filter @obsunified/mcp-server run build

      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmjs.npmrc
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required to publish @obsunified/mcp-server to npmjs." >&2
            exit 1
          fi
          {
            echo "registry=https://registry.npmjs.org/"
            echo "@obsunified:registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          } > "${NPM_CONFIG_USERCONFIG}"
          cp "${NPM_CONFIG_USERCONFIG}" packages/mcp-server/.npmrc
          if [ -f .npmrc ]; then
            mv .npmrc .npmrc.github-packages
          fi
          version="$(node -p "require('./packages/mcp-server/package.json').version")"
          if npm view "@obsunified/mcp-server@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@obsunified/mcp-server@${version} is already published; skipping."
            exit 0
          fi
          npm publish ./packages/mcp-server --access public --registry=https://registry.npmjs.org
          npm view "@obsunified/mcp-server@${version}" version --registry=https://registry.npmjs.org
