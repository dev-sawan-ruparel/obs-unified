name: Publish Rust SDK

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without publishing to crates.io"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "rust-sdk-v*"

concurrency:
  group: publish-rust-sdk-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish obs-unified crate
    runs-on: [self-hosted, obs-unified]
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo package

      - name: Publish to crates.io
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is required to publish the Rust SDK to crates.io." >&2
            exit 1
          fi
          cargo publish --token "${CARGO_REGISTRY_TOKEN}"
