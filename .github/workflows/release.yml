name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: [self-hosted, obs-unified]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          # Unique per-runner dir avoids the ENOTEMPTY race when concurrent
          # self-hosted runner instances share the default ~/setup-pnpm.
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@obs-unified"

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --sort run build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.OBS_UNIFIED_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.OBS_UNIFIED_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
