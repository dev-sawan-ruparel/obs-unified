name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: [self-hosted, ci]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ShellCheck
        run: command -v shellcheck >/dev/null || brew install shellcheck
      - name: Lint shell scripts
        run: make lint
