# Local-dev stack for the standalone Node collector. Brings up a
# Postgres + RustFS (S3-compatible) + collector trio on localhost.
#
# RustFS replaces MinIO: the previous `minio/minio` and `minio/mc` image
# references were unavailable during smoke testing, so the stack pins a
# pullable S3-compatible test image instead. Bump the pinned tag deliberately.
#
#   docker compose up -d           # start
#   docker compose logs -f         # tail
#   docker compose down -v         # tear down + delete volumes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obs
      POSTGRES_PASSWORD: obs
      POSTGRES_DB: obs_unified
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obs -d obs_unified"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: obs
      RUSTFS_SECRET_KEY: obs-secret-123
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the buckets with the collector image's own AWS SDK — no
  # separate `mc` image to pull. See scripts/ensure-buckets.mjs.
  bucket-init:
    build:
      context: ../..
      dockerfile: apps/collector-node/Dockerfile
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: obs
      S3_SECRET_ACCESS_KEY: obs-secret-123
      S3_INIT_BUCKETS: obs-replays,obs-profiles
    entrypoint: ["node", "scripts/ensure-buckets.mjs"]

  migrate:
    build:
      context: ../..
      dockerfile: apps/collector-node/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://obs:obs@postgres:5432/obs_unified
    entrypoint: ["node", "scripts/migrate-pg.mjs"]

  collector:
    build:
      context: ../..
      dockerfile: apps/collector-node/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://obs:obs@postgres:5432/obs_unified
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: obs-replays
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: obs
      S3_SECRET_ACCESS_KEY: obs-secret-123
      INGEST_KEY: dev-ingest-key
      DASHBOARD_PASSWORD: e2e-test-pass
      DASHBOARD_TOKEN: e2e-dashboard-token
      ALLOWED_ORIGINS: "http://localhost:5173"
      PORT: 8790
    ports:
      - "8790:8790"

volumes:
  pg_data:
  rustfs_data:
