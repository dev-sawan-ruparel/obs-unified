name = "obs-demo-collector"
compatibility_date = "2025-01-01"
# Required by @obs/telemetry-sdk used for self-instrumentation:
# uses node:async_hooks (AsyncLocalStorage) and node:crypto (randomBytes).
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

[triggers]
# Every-minute analyses runner (RFC 0002 — Tier 0 panels need 60s freshness),
# every-5-min alert evaluator, hourly retention cleanup. All three patterns
# fire the same scheduled handler; the runner only writes results for
# analyses whose `last_run + refreshSeconds < now`, so the per-minute tick
# is cheap when nothing is due.
crons = ["* * * * *", "*/5 * * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "obs-collector-db"
database_id = "local-dev-collector"

[[durable_objects.bindings]]
name = "TAIL_HUB"
class_name = "TailHub"

[[migrations]]
tag = "v1"
new_classes = ["TailHub"]

[vars]
RETENTION_HOURS = "72"
# Set these in production (wrangler secret put):
# INGEST_KEY = "your-ingest-api-key"
# DASHBOARD_PASSWORD = "your-dashboard-password"
# ALLOWED_ORIGINS = "https://my-app.com"
# RFC 0002 Stage 3 + 5 — narrative pipeline + Ask box. Optional; when
# neither API key is set the narrate pass and Ask endpoint are disabled
# and panels remain data-only.
#
# Either provider works; OpenAI wins if both are set.
# ANTHROPIC_API_KEY = "sk-ant-…"
# OPENAI_API_KEY    = "sk-…"
# OPENAI_BASE_URL   = "https://api.openai.com/v1"   # override for openrouter,
#                                                    # vLLM, azure-openai-compat,
#                                                    # ollama, etc.
# NARRATIVE_MODEL          = "claude-haiku-4-5"  # provider-specific (default
#                                                #   gpt-4o-mini for openai,
#                                                #   claude-haiku-4-5 for
#                                                #   anthropic)
# NARRATIVE_BUDGET_PER_HOUR = "50"
# Auth is enforced locally; DASHBOARD_PASSWORD is in .dev.vars and ingest keys
# are created via the dashboard. To re-enable open-mode dev, set this to "true".
ALLOW_UNAUTHENTICATED = "false"

[[r2_buckets]]
binding = "REPLAYS_BUCKET"
bucket_name = "obs-demo-replays"
preview_bucket_name = "obs-demo-replays"
