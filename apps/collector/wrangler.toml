name = "obs-demo-collector"
compatibility_date = "2025-01-01"
main = "src/index.ts"

[triggers]
# Every-minute analyses runner (RFC 0002 — Tier 0 panels need 60s freshness),
# every-5-min alert evaluator, hourly retention cleanup. All three patterns
# fire the same scheduled handler; the runner only writes results for
# analyses whose `last_run + refreshSeconds < now`, so the per-minute tick
# is cheap when nothing is due.
crons = ["* * * * *", "*/5 * * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "obs-collector-db"
database_id = "local-dev-collector"

[[durable_objects.bindings]]
name = "TAIL_HUB"
class_name = "TailHub"

[[migrations]]
tag = "v1"
new_classes = ["TailHub"]

[vars]
RETENTION_HOURS = "72"
# Set these in production (wrangler secret put):
# INGEST_KEY = "your-ingest-api-key"
# DASHBOARD_PASSWORD = "your-dashboard-password"
# ALLOWED_ORIGINS = "https://my-app.com"
# RFC 0002 Stage 3 — narrative pipeline. Optional; when ANTHROPIC_API_KEY is
# unset the narrate pass is skipped and panels remain data-only.
# ANTHROPIC_API_KEY = "sk-ant-…"
# NARRATIVE_MODEL = "claude-haiku-4-5"
# NARRATIVE_BUDGET_PER_HOUR = "50"
ALLOW_UNAUTHENTICATED = "true"

[[r2_buckets]]
binding = "REPLAYS_BUCKET"
bucket_name = "obs-demo-replays"
preview_bucket_name = "obs-demo-replays"
