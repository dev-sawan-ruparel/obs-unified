<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="obs-unified docs — read the source, run the stack">
  <title>obs-unified docs</title>
  <!-- Clinical White outer canvas -->
  <rect width="1200" height="630" fill="#F9F9F9"/>

  <!-- Subtle architectural grid lines on outer margin -->
  <line x1="40" y1="0" x2="40" y2="630" stroke="#E2E4E4" stroke-width="1"/>
  <line x1="1160" y1="0" x2="1160" y2="630" stroke="#E2E4E4" stroke-width="1"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#E2E4E4" stroke-width="1"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#E2E4E4" stroke-width="1"/>

  <!-- Main work plane -->
  <rect x="40" y="40" width="1120" height="550" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
  <rect x="40" y="40" width="12" height="550" fill="#006B18"/>

  <!-- Brand mark + wordmark -->
  <g transform="translate(96 80)">
    <rect width="64" height="64" fill="#006B18"/>
    <path d="M14 18 L20 28 L14 38" fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linejoin="bevel" stroke-linecap="square"/>
    <rect x="28" y="25.8" width="24" height="4.4" fill="#FFFFFF"/>
    <rect x="28" y="37.8" width="16" height="4.4" fill="#FFFFFF"/>
    <text
      x="86" y="42"
      fill="#1A1C1C"
      font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="2.8"
    >OBS-UNIFIED</text>
  </g>

  <!-- Eyebrow tag (exact messaging) -->
  <rect x="96" y="196" width="8" height="8" fill="#006B18"/>
  <text
    x="114" y="205"
    fill="#006B18"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="1.7"
  >DOCUMENTATION · DEPLOY · SDKs</text>

  <!-- Headline (exact messaging) -->
  <text
    x="96" y="308"
    fill="#1A1C1C"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="72"
    font-weight="300"
    letter-spacing="-1.8"
  >Read the source.</text>
  <text
    x="96" y="396"
    fill="#006B18"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="72"
    font-weight="300"
    letter-spacing="-1.8"
  >Run the stack.</text>

  <!-- Subhead (exact messaging) -->
  <text
    x="96" y="458"
    fill="#4E5555"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="20"
    font-weight="400"
  >Collector · Dashboard · Telemetry SDK · Analytics SDK · CLI</text>

  <!-- Right-hand Technical Monolith Docs Reference Panel -->
  <g transform="translate(736 76)">
    <rect width="388" height="432" fill="#F9F9F9" stroke="#E2E4E4" stroke-width="1"/>
    <rect width="388" height="36" fill="#1A1C1C"/>
    <rect x="14" y="13" width="10" height="10" fill="#006B18"/>
    <text
      x="32" y="23"
      fill="#FFFFFF"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="1.2"
    >DOCS CORPUS · HUMAN + LLM</text>
    <text
      x="374" y="23"
      text-anchor="end"
      fill="#8CE89A"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="11"
      font-weight="600"
    >llms.txt</text>

    <!-- Quickstart terminal card -->
    <rect x="16" y="52" width="356" height="86" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
    <rect x="16" y="52" width="4" height="86" fill="#006B18"/>
    <text x="30" y="72" fill="#006B18" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ZERO-CLONE LOCAL STACK</text>
    <text x="30" y="96" fill="#1A1C1C" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="600">ghcr.io/dev-sawan-ruparel/obs-unified</text>
    <text x="30" y="118" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">pnpm dlx @obsunified/cli doctor</text>

    <!-- Documentation sections list -->
    <g transform="translate(16 152)">
      <rect width="356" height="44" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="44" fill="#006B18"/>
      <text x="16" y="27" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">SDKs &amp; Instrumentation</text>
      <text x="342" y="27" text-anchor="end" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">TS · Go · Rust · Py</text>
    </g>
    <g transform="translate(16 206)">
      <rect width="356" height="44" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="44" fill="#006B18"/>
      <text x="16" y="27" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Evidence Retrieval (CCR)</text>
      <text x="342" y="27" text-anchor="end" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10">bundles · refs</text>
    </g>
    <g transform="translate(16 260)">
      <rect width="356" height="44" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="44" fill="#006B18"/>
      <text x="16" y="27" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Agent Action Graph &amp; MCP</text>
      <text x="342" y="27" text-anchor="end" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">26 MCP tools</text>
    </g>
    <g transform="translate(16 314)">
      <rect width="356" height="44" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="44" fill="#006B18"/>
      <text x="16" y="27" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">AutoSRE &amp; Production Ops</text>
      <text x="342" y="27" text-anchor="end" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">Workers · Node · PG</text>
    </g>

    <!-- Machine-readable AEO footer -->
    <rect x="16" y="370" width="356" height="46" fill="#F3F3F3" stroke="#E2E4E4" stroke-width="1"/>
    <text x="28" y="398" fill="#006B18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="700">/llms.txt · /llms-full.txt · /llms.mdx/*</text>
  </g>

  <!-- Footer strip (exact messaging) -->
  <rect x="52" y="540" width="1108" height="50" fill="#F3F3F3"/>
  <line x1="52" y1="540" x2="1160" y2="540" stroke="#E2E4E4" stroke-width="1"/>
  <text
    x="96" y="571"
    fill="#4E5555"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="15"
    font-weight="600"
  >docs.obsunified.com</text>
  <text
    x="1124" y="571"
    text-anchor="end"
    fill="#1A1C1C"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="15"
    font-weight="700"
  >npm i @obsunified/telemetry-sdk</text>
</svg>
