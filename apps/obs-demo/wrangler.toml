name = "obs-demo"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

# Public config — override via `wrangler secret put` or .dev.vars for local.
[vars]
OBS_COLLECTOR_URL = "http://127.0.0.1:28790"
OBS_INGEST_KEY = ""
# LLM provider keys (local dev only — put in .dev.vars, never here)
OPENAI_API_KEY = ""
ANTHROPIC_API_KEY = ""
GOOGLE_API_KEY = ""
OPENAI_MODEL = "gpt-4o-mini"
ANTHROPIC_MODEL = "claude-3-5-haiku-latest"
GEMINI_MODEL = "gemini-1.5-flash"
