<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>obs-unified</title>
    <meta name="theme-color" content="#006B18" />

    <!-- Brand assets — managed by @obs-unified/brand. Re-run
         `node packages/brand/scripts/sync-to-projects.mjs` after edits. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="obs-unified — self-hosted observability" />
    <meta property="og:description" content="Every signal, one ledger. Traces, logs, AI calls, replay, usage, and alerts — correlated end-to-end." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (() => {
        try {
          var t = localStorage.getItem("obs.theme");
          if (t === "dark") document.documentElement.dataset.theme = "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
