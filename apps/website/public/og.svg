<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Observability Unified — one telemetry graph for humans and AI agents debugging software">
  <title>Observability Unified</title>
  <!-- Clinical White outer canvas -->
  <rect width="1200" height="630" fill="#F9F9F9"/>

  <!-- Subtle architectural grid lines on outer margin -->
  <line x1="40" y1="0" x2="40" y2="630" stroke="#E2E4E4" stroke-width="1"/>
  <line x1="1160" y1="0" x2="1160" y2="630" stroke="#E2E4E4" stroke-width="1"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#E2E4E4" stroke-width="1"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#E2E4E4" stroke-width="1"/>

  <!-- Main work plane -->
  <rect x="40" y="40" width="1120" height="550" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
  <rect x="40" y="40" width="12" height="550" fill="#006B18"/>

  <!-- Brand mark + wordmark -->
  <g transform="translate(96 80)">
    <rect width="64" height="64" fill="#006B18"/>
    <path d="M14 18 L20 28 L14 38" fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linejoin="bevel" stroke-linecap="square"/>
    <rect x="28" y="25.8" width="24" height="4.4" fill="#FFFFFF"/>
    <rect x="28" y="37.8" width="16" height="4.4" fill="#FFFFFF"/>
    <text
      x="86" y="42"
      fill="#1A1C1C"
      font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="2.8"
    >OBSERVABILITY UNIFIED</text>
  </g>

  <!-- Eyebrow tag -->
  <rect x="96" y="196" width="8" height="8" fill="#006B18"/>
  <text
    x="114" y="205"
    fill="#006B18"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="1.7"
  >SELF-HOSTED OBSERVABILITY · MIT</text>

  <!-- Headline (exact messaging) -->
  <text
    x="96" y="308"
    fill="#1A1C1C"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="68"
    font-weight="300"
    letter-spacing="-1.6"
  >Debug AI agents.</text>
  <text
    x="96" y="396"
    fill="#006B18"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="68"
    font-weight="300"
    letter-spacing="-1.6"
  >Help agents debug.</text>

  <!-- Subhead (exact messaging) -->
  <text
    x="96" y="458"
    fill="#4E5555"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="20"
    font-weight="400"
  >One graph for traces, logs, replay, AI cost, MCP, and CPU.</text>

  <!-- Right-hand Technical Monolith Telemetry Graph Panel -->
  <g transform="translate(736 76)">
    <rect width="388" height="432" fill="#F9F9F9" stroke="#E2E4E4" stroke-width="1"/>
    <rect width="388" height="36" fill="#1A1C1C"/>
    <rect x="14" y="13" width="10" height="10" fill="#006B18"/>
    <text
      x="32" y="23"
      fill="#FFFFFF"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="11"
      font-weight="700"
      letter-spacing="1.2"
    >TELEMETRY GRAPH · CCR + MCP</text>
    <text
      x="374" y="23"
      text-anchor="end"
      fill="#8CE89A"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="11"
      font-weight="600"
    >LIVE</text>

    <!-- Identity Chain Spine -->
    <rect x="16" y="52" width="356" height="58" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
    <rect x="16" y="52" width="4" height="58" fill="#006B18"/>
    <text
      x="30" y="72"
      fill="#006B18"
      font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
      font-size="10"
      font-weight="700"
      letter-spacing="1.2"
    >IDENTITY PROPAGATED END-TO-END</text>
    <text
      x="30" y="95"
      fill="#1A1C1C"
      font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
      font-size="11.5"
      font-weight="600"
    >user → session → interaction → trace → action</text>

    <!-- Connector lines -->
    <line x1="105" y1="110" x2="105" y2="128" stroke="#006B18" stroke-width="1.5"/>
    <line x1="283" y1="110" x2="283" y2="128" stroke="#006B18" stroke-width="1.5"/>

    <!-- 2x3 Signal Nodes Grid -->
    <!-- Row 1 -->
    <g transform="translate(16 128)">
      <rect width="172" height="64" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="64" fill="#006B18"/>
      <text x="14" y="24" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Traces &amp; Spans</text>
      <text x="14" y="46" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">OTLP · critical path</text>
    </g>
    <g transform="translate(200 128)">
      <rect width="172" height="64" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="64" fill="#006B18"/>
      <text x="14" y="24" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Structured Logs</text>
      <text x="14" y="46" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">3 exemplars / 500</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(16 204)">
      <rect width="172" height="64" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="64" fill="#006B18"/>
      <text x="14" y="24" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">Agent Action Graph</text>
      <text x="14" y="46" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">runs · tools · evals</text>
    </g>
    <g transform="translate(200 204)">
      <rect width="172" height="64" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="64" fill="#006B18"/>
      <text x="14" y="24" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">AI Cost &amp; Replay</text>
      <text x="14" y="46" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">tokens · USD · rrweb</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(16 280)">
      <rect width="172" height="64" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="64" fill="#006B18"/>
      <text x="14" y="24" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">AutoSRE Ontology</text>
      <text x="14" y="46" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">cohort lift · grants</text>
    </g>
    <g transform="translate(200 280)">
      <rect width="172" height="64" fill="#FFFFFF" stroke="#E2E4E4" stroke-width="1"/>
      <rect width="4" height="64" fill="#006B18"/>
      <text x="14" y="24" fill="#1A1C1C" font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700">CPU Profiles &amp; MCP</text>
      <text x="14" y="46" fill="#6B7171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">pprof · 30 MCP tools</text>
    </g>

    <!-- CCR Bundle Summary Bar -->
    <rect x="16" y="360" width="356" height="56" fill="#F3F3F3" stroke="#E2E4E4" stroke-width="1"/>
    <text x="28" y="382" fill="#006B18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">CCR EVIDENCE BUNDLE</text>
    <text x="360" y="382" text-anchor="end" fill="#006B18" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">-97.4% TOKENS</text>
    <text x="28" y="402" fill="#4E5555" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">50,602 → 1,319 est. tokens · citations + refs</text>
  </g>

  <!-- Footer strip (exact messaging) -->
  <rect x="52" y="540" width="1108" height="50" fill="#F3F3F3"/>
  <line x1="52" y1="540" x2="1160" y2="540" stroke="#E2E4E4" stroke-width="1"/>
  <text
    x="96" y="571"
    fill="#4E5555"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="15"
    font-weight="600"
  >obsunified.com</text>
  <text
    x="1124" y="571"
    text-anchor="end"
    fill="#1A1C1C"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="15"
    font-weight="700"
  >ship in &lt; 5 min</text>
</svg>
