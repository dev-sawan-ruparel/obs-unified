# =============================================================================
# Production Nginx Reverse Proxy with oauth2-proxy for obs-unified
# File location: /etc/nginx/conf.d/default.conf (conf.d fragment)
# =============================================================================
#
# Boundaries:
#   /health       -> Collector (:8790) [Public / unauthenticated]
#   /v1/*         -> Collector (:8790) [Bypasses SSO, authenticated via Ingest Key]
#   /oauth2/*     -> oauth2-proxy (:4180) [OIDC auth endpoints]
#   /auth/*       -> Collector (:8790) [Protected by SSO, passes session cookies]
#   /internal/*   -> Collector (:8790) [Protected by SSO, passes session cookies & X-Project-Id]
#   /             -> Dashboard (:5173) [Protected by SSO, serves SPA assets]
# =============================================================================

upstream collector_backend {
    server obs-collector:8790;
    keepalive 32;
}

upstream dashboard_backend {
    server obs-web:5173;
    keepalive 16;
}

upstream oauth2_proxy_backend {
    server oauth2-proxy:4180;
}

server {
    listen 80;
    server_name obs.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name obs.example.com;

    # TLS Configuration (enable when certificates are provisioned)
    ssl_certificate /etc/ssl/certs/obs.example.com.crt;
    ssl_certificate_key /etc/ssl/private/obs.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # -------------------------------------------------------------------------
    # 1. Health Probe (Public / Unauthenticated)
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass http://collector_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 2. Telemetry Ingest (Bypasses SSO; requires Ingest Key)
    # -------------------------------------------------------------------------
    location /v1/ {
        client_max_body_size 10m;

        proxy_pass http://collector_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # 3. oauth2-proxy Auth Subrequest & Callbacks
    # -------------------------------------------------------------------------
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2_proxy_backend;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    location /oauth2/ {
        proxy_pass http://oauth2_proxy_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # -------------------------------------------------------------------------
    # 4. Dashboard Authentication Routes (/auth/*) -> Collector (:8790)
    # -------------------------------------------------------------------------
    location /auth/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        proxy_pass http://collector_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # -------------------------------------------------------------------------
    # 5. Internal Query Endpoints (Protected by SSO) -> Collector (:8790)
    # -------------------------------------------------------------------------
    location /internal/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        auth_request_set $user $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_pass http://collector_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass identity headers from oauth2-proxy
        proxy_set_header X-Auth-User $user;
        proxy_set_header X-Auth-Email $email;

        # Forward cookies for collector's dashboardAuth
        proxy_set_header Cookie $http_cookie;

        # Forward X-Project-Id for tenant project selection
        proxy_set_header X-Project-Id $http_x_project_id;
    }

    # -------------------------------------------------------------------------
    # 6. Dashboard SPA Frontend Assets -> Dashboard (:5173)
    # -------------------------------------------------------------------------
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in?rd=$scheme://$host$request_uri;

        proxy_pass http://dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA client routing fallback is handled upstream by dashboard_backend
    }
}
