<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="obs-unified maskable icon">
  <title>obs-unified</title>
  <defs>
    <linearGradient id="ouMaskable" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#006B18"/>
      <stop offset="1" stop-color="#008821"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ouMaskable)"/>
  <!-- Maskable safe-zone is the centered 80% circle (~205px from center).
       Keep all glyph content within the inner 410x410 area centered at 256. -->
  <g transform="translate(160 196)">
    <rect x="0"  y="0"  width="142" height="22" fill="#FFFFFF"/>
    <rect x="0"  y="44" width="90"  height="22" fill="#FFFFFF"/>
    <rect x="0"  y="88" width="168" height="22" fill="#FFFFFF"/>
  </g>
</svg>
