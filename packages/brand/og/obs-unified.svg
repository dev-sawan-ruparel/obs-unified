<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="obs-unified — every signal, one ledger">
  <title>obs-unified</title>
  <defs>
    <linearGradient id="ouOgMark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#006B18"/>
      <stop offset="1" stop-color="#008821"/>
    </linearGradient>
  </defs>

  <!-- Clinical White canvas -->
  <rect width="1200" height="630" fill="#F9F9F9"/>

  <!-- Tonal islanding: a #FFFFFF active work plane inset from the canvas
       to provide separation without a 1px border. -->
  <rect x="40" y="40" width="1120" height="550" fill="#FFFFFF"/>

  <!-- Local-first indicator: 12px primary vertical accent on left edge of
       the work plane. Carries the brand bar from the data list pattern. -->
  <rect x="40" y="40" width="12" height="550" fill="#006B18"/>

  <!-- Brand mark + wordmark, top-left -->
  <g transform="translate(96 80)">
    <rect width="64" height="64" fill="url(#ouOgMark)"/>
    <rect x="12" y="18"   width="34" height="5" fill="#FFFFFF"/>
    <rect x="12" y="29.5" width="22" height="5" fill="#FFFFFF"/>
    <rect x="12" y="41"   width="40" height="5" fill="#FFFFFF"/>
    <text
      x="86" y="42"
      fill="#1A1C1C"
      font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
      font-size="20"
      font-weight="700"
      letter-spacing="2.8"
    >OBS-UNIFIED</text>
  </g>

  <!-- Section label tag — 10px UPPERCASE 700 0.12em tracking, primary -->
  <text
    x="96" y="220"
    fill="#006B18"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="14"
    font-weight="700"
    letter-spacing="1.7"
  >SELF-HOSTED OBSERVABILITY · MIT</text>

  <!-- Editorial data-hero headline -->
  <text
    x="96" y="328"
    fill="#1A1C1C"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="92"
    font-weight="300"
    letter-spacing="-2.2"
  >Every signal,</text>
  <text
    x="96" y="424"
    fill="#006B18"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="92"
    font-weight="300"
    letter-spacing="-2.2"
  >one ledger.</text>

  <!-- Subhead -->
  <text
    x="96" y="478"
    fill="#4E5555"
    font-family="'Inter Variable','Inter',ui-sans-serif,system-ui,sans-serif"
    font-size="22"
    font-weight="400"
  >Traces · Logs · AI calls · Replay · Usage · Alerts · Profiles</text>

  <!-- Bottom row: tonal-islanding strip with attribution and a tabular
       numeric stat to nod at the "data hero" treatment. -->
  <rect x="40" y="540" width="1120" height="50" fill="#F3F3F3"/>
  <text
    x="96" y="572"
    fill="#6B7171"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="14"
    font-weight="500"
  >github.com/obs-unified/obs-unified</text>
  <text
    x="1104" y="572"
    text-anchor="end"
    fill="#1A1C1C"
    font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="14"
    font-weight="600"
  >MIT · self-hosted</text>
</svg>
